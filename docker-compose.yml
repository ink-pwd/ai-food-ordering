services:
  app:
    image: webdevops/php-nginx:8.5-alpine
    container_name: food-ordering-app
    working_dir: /app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend:/app
    environment:
      WEB_DOCUMENT_ROOT: /app/public
      PHP_DISPLAY_ERRORS: 1
    depends_on:
      - db
      - redis
      - rabbitmq

  db:
    image: postgres:17-alpine
    container_name: food-ordering-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: food_ordering
      POSTGRES_USER: food_ordering
      POSTGRES_PASSWORD: root
    ports:
      - "5433:5432"
    volumes:
      - database-data:/var/lib/postgresql/data

  db_test:
    image: postgres:17-alpine
    container_name: food-ordering-db-test
    restart: unless-stopped
    profiles:
      - test
    environment:
      POSTGRES_DB: food_ordering_testing
      POSTGRES_USER: food_ordering
      POSTGRES_PASSWORD: root
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: food-ordering-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    container_name: food-ordering-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: food_ordering
      RABBITMQ_DEFAULT_PASS: root
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  adminer:
    image: adminer:latest
    container_name: food-ordering-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - db

  mcp-server:
    image: webdevops/php-nginx:8.5-alpine
    container_name: food-ordering-mcp
    working_dir: /app
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./mcp-server:/app
    environment:
      WEB_DOCUMENT_ROOT: /app/public
      PHP_DISPLAY_ERRORS: 1
    depends_on:
      - app

  telegram-bot:
    image: webdevops/php-nginx:8.5-alpine
    container_name: food-ordering-telegram
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./telegram-bot:/app
    command: [ "php", "artisan", "nutgram:run" ]
    depends_on:
      - app

volumes:
  database-data:
  redis-data:
  rabbitmq-data: