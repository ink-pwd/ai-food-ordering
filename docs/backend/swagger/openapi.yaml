openapi: 3.1.0
info:
  title: AI Food Ordering Backend Internal API
  version: 1.0.0
  description: Internal Laravel backend API for Telegram and MCP clients. All endpoints require the internal API token; session-bound endpoints also require a session token.
servers:
  - url: http://localhost:8080
    description: Local Docker backend
security:
  - internalApiToken: []
tags:
  - name: Cities
  - name: Sessions
  - name: Fulfillment
  - name: Catalog
  - name: Cart
  - name: Orders
  - name: Payment
paths:
  /api/cities:
    get:
      tags: [Cities]
      summary: List active synchronized cities
      operationId: listCities
      responses:
        '200':
          description: Active cities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityCollectionResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/sessions:
    post:
      tags: [Sessions]
      summary: Create an internal ordering session
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, external_session_id]
              properties:
                channel:
                  type: string
                  enum: [chatgpt, telegram]
                  example: chatgpt
                external_session_id:
                  type: string
                  maxLength: 255
                  example: telegram-chat-123
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCreatedResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/sessions/current/contact:
    put:
      tags: [Sessions]
      summary: Save or replace current session contact
      operationId: updateSessionContact
      security:
        - internalApiToken: []
          sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone]
              properties:
                name: { type: string, maxLength: 100, example: Yehor }
                phone: { type: string, maxLength: 32, example: '+380931234567' }
      responses:
        '200':
          description: Contact saved; phone verification is reset until OTP verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/sessions/current/otp:
    post:
      tags: [Sessions]
      summary: Request OTP for current contact
      operationId: requestSessionOtp
      security:
        - internalApiToken: []
          sessionToken: []
      responses:
        '200':
          description: OTP challenge created; raw code is not returned
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [expires_in, resend_available_in]
                    properties:
                      expires_in: { type: integer, example: 300 }
                      resend_available_in: { type: integer, example: 60 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/sessions/current/otp/verify:
    post:
      tags: [Sessions]
      summary: Verify OTP for current contact
      operationId: verifySessionOtp
      security:
        - internalApiToken: []
          sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^\d+$', example: '123456' }
      responses:
        '200':
          description: Phone verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/sessions/current/city:
    put:
      tags: [Sessions]
      summary: Select current session city
      operationId: selectSessionCity
      security:
        - internalApiToken: []
          sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [city_id]
              properties:
                city_id: { type: integer, example: 1 }
      responses:
        '200':
          description: City selected
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      session_id: { type: string }
                      city: { $ref: '#/components/schemas/City' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/sessions/current/restaurants:
    get:
      tags: [Sessions]
      summary: List active restaurants for the selected city
      operationId: listSessionRestaurants
      security:
        - internalApiToken: []
          sessionToken: []
      responses:
        '200':
          description: Restaurants available in current city
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantCollectionResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/sessions/current/restaurant:
    put:
      tags: [Sessions]
      summary: Select current session restaurant
      operationId: selectSessionRestaurant
      security:
        - internalApiToken: []
          sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [restaurant_id]
              properties:
                restaurant_id: { type: integer, example: 10 }
      responses:
        '200':
          description: Restaurant selected
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      session_id: { type: string }
                      restaurant: { $ref: '#/components/schemas/Restaurant' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/sessions/current/fulfillment-options:
    get:
      tags: [Fulfillment]
      summary: List available fulfillment options for current restaurant
      operationId: listFulfillmentOptions
      security:
        - internalApiToken: []
          sessionToken: []
      responses:
        '200':
          description: Available fulfillment types
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        type: { type: string, enum: [delivery, pickup] }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/sessions/current/fulfillment:
    put:
      tags: [Fulfillment]
      summary: Select pickup or delivery fulfillment
      operationId: selectFulfillment
      security:
        - internalApiToken: []
          sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [delivery, pickup], example: pickup }
      responses:
        '200': { $ref: '#/components/responses/FulfillmentState' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/sessions/current/pickup-addresses:
    get:
      tags: [Fulfillment]
      summary: List active pickup addresses for selected restaurant
      operationId: listPickupAddresses
      security:
        - internalApiToken: []
          sessionToken: []
      responses:
        '200':
          description: Pickup addresses
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RestaurantAddress' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/sessions/current/pickup-address:
    put:
      tags: [Fulfillment]
      summary: Select pickup address for current session
      operationId: selectPickupAddress
      security:
        - internalApiToken: []
          sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [restaurant_address_id]
              properties:
                restaurant_address_id: { type: integer, example: 5 }
      responses:
        '200': { $ref: '#/components/responses/FulfillmentState' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/sessions/current/delivery-address:
    post:
      tags: [Fulfillment]
      summary: Validate delivery address through Dots and selected restaurant delivery zone
      operationId: validateDeliveryAddress
      security:
        - internalApiToken: []
          sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryAddressInput'
      responses:
        '200':
          description: Delivery validation result. `delivery_available=false` is a business result, not a technical error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryValidationResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '502': { $ref: '#/components/responses/ServerError' }
  /api/sessions/current:
    delete:
      tags: [Sessions]
      summary: Close current session and abandon unfinished active cart
      operationId: exitSession
      security:
        - internalApiToken: []
          sessionToken: []
      responses:
        '200':
          description: Session closed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      session_id: { type: string }
                      status: { type: string, example: closed }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/restaurants/{restaurant}/catalog:
    get:
      tags: [Catalog]
      summary: Get full restaurant catalog
      operationId: getRestaurantCatalog
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
      responses:
        '200':
          description: Catalog categories with products
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CatalogCategory' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/restaurants/{restaurant}/categories:
    get:
      tags: [Catalog]
      summary: List restaurant categories
      operationId: listRestaurantCategories
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
      responses:
        '200': { $ref: '#/components/responses/CategoryCollection' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/restaurants/{restaurant}/categories/{category}/products:
    get:
      tags: [Catalog]
      summary: List products in a restaurant category
      operationId: listCategoryProducts
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
        - name: category
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/ProductCollection' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/restaurants/{restaurant}/products/{product}:
    get:
      tags: [Catalog]
      summary: Show a restaurant product
      operationId: showRestaurantProduct
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
        - name: product
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/restaurants/{restaurant}/products/search:
    get:
      tags: [Catalog]
      summary: Search restaurant products
      operationId: searchRestaurantProducts
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
          example: pizza
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200': { $ref: '#/components/responses/ProductCollection' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/carts:
    post:
      tags: [Cart]
      summary: Create or return current active cart for session
      operationId: createCart
      security:
        - internalApiToken: []
          sessionToken: []
      responses:
        '201': { $ref: '#/components/responses/CartResponse' }
        '200': { $ref: '#/components/responses/CartResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/carts/current:
    get:
      tags: [Cart]
      summary: Get current active cart
      operationId: showCurrentCart
      security:
        - internalApiToken: []
          sessionToken: []
      responses:
        '200': { $ref: '#/components/responses/CartResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/carts/current/items:
    post:
      tags: [Cart]
      summary: Add product to current cart
      operationId: addCartItem
      security:
        - internalApiToken: []
          sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, quantity]
              properties:
                product_id: { type: integer, example: 100 }
                quantity: { type: integer, minimum: 1, example: 1 }
      responses:
        '201': { $ref: '#/components/responses/CartResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Cart]
      summary: Clear current cart items
      operationId: clearCartItems
      security:
        - internalApiToken: []
          sessionToken: []
      responses:
        '200': { $ref: '#/components/responses/CartResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/carts/current/items/{item}:
    patch:
      tags: [Cart]
      summary: Update cart item quantity
      operationId: updateCartItem
      security:
        - internalApiToken: []
          sessionToken: []
      parameters:
        - name: item
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1, example: 2 }
      responses:
        '200': { $ref: '#/components/responses/CartResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Cart]
      summary: Remove cart item
      operationId: removeCartItem
      security:
        - internalApiToken: []
          sessionToken: []
      parameters:
        - name: item
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/CartResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/orders:
    post:
      tags: [Orders]
      summary: Create idempotent current session order
      operationId: createOrder
      security:
        - internalApiToken: []
          sessionToken: []
          idempotencyKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delivery_time]
              properties:
                delivery_time: { type: integer, minimum: 0, example: 1790000000 }
      responses:
        '201': { $ref: '#/components/responses/OrderResponse' }
        '200':
          description: Idempotent replay returns existing order and never creates a second Dots order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '502': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ServerError' }
  /api/orders/current:
    get:
      tags: [Orders]
      summary: Get current session order and refresh async Dots order status when applicable
      operationId: showCurrentOrder
      security:
        - internalApiToken: []
          sessionToken: []
      responses:
        '200': { $ref: '#/components/responses/OrderResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/orders/current/payment:
    get:
      tags: [Payment]
      summary: Get or retry current order online payment data
      operationId: showCurrentPayment
      security:
        - internalApiToken: []
          sessionToken: []
      responses:
        '200':
          description: Payment ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentStateEnvelope' }
        '202':
          description: Payment pending; no checkout URL is available yet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentStateEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/orders/current/payment/qr:
    get:
      tags: [Payment]
      summary: Get current order payment QR PNG
      operationId: showCurrentPaymentQr
      security:
        - internalApiToken: []
          sessionToken: []
      responses:
        '200':
          description: PNG QR bytes generated from the persisted trusted checkout URL
          content:
            image/png:
              schema:
                type: string
                format: binary
        '202':
          description: Payment pending; QR is not generated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentStateEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/ServerError' }
components:
  securitySchemes:
    internalApiToken:
      type: apiKey
      in: header
      name: X-Internal-Api-Token
    sessionToken:
      type: apiKey
      in: header
      name: X-Session-Token
    idempotencyKey:
      type: apiKey
      in: header
      name: Idempotency-Key
  parameters:
    RestaurantSlug:
      name: restaurant
      in: path
      required: true
      schema: { type: string }
      example: e2e-restaurant
  responses:
    Unauthenticated:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Unauthenticated. }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Current business state does not allow the operation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    ServerError:
      description: Upstream or internal technical failure
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    FulfillmentState:
      description: Updated fulfillment state
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  session_id: { type: string }
                  fulfillment: { $ref: '#/components/schemas/Fulfillment' }
    CategoryCollection:
      description: Categories
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items: { $ref: '#/components/schemas/Category' }
    ProductCollection:
      description: Products
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items: { $ref: '#/components/schemas/Product' }
    CartResponse:
      description: Cart state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CartEnvelope' }
    OrderResponse:
      description: Order state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OrderEnvelope' }
  schemas:
    Error:
      type: object
      properties:
        message: { type: string, example: Unauthenticated. }
    ValidationError:
      type: object
      properties:
        message: { type: string, example: The given data was invalid. }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    SessionCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            session_id: { type: string, example: 01JZXYZSESSION000000000001 }
            session_token: { type: string, example: '<session-token>' }
            channel: { type: string, example: chatgpt }
            status: { type: string, example: active }
            expires_at: { type: string, format: date-time }
            city: { nullable: true }
            restaurant: { nullable: true }
    ContactResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            session_id: { type: string }
            contact: { $ref: '#/components/schemas/Contact' }
    Contact:
      type: object
      properties:
        name: { type: string, example: Yehor }
        phone: { type: string, example: '+380931234567' }
        phone_verified: { type: boolean, example: false }
    CityCollectionResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/City' }
    City:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        currency: { type: string, example: UAH }
        timezone: { type: string, example: Europe/Kyiv }
        center:
          type: object
          properties:
            latitude: { type: string, nullable: true }
            longitude: { type: string, nullable: true }
    RestaurantCollectionResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Restaurant' }
    Restaurant:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        image_url: { type: string, nullable: true }
        currency: { type: string }
        locale: { type: string }
        timezone: { type: string }
        available_payment_types:
          type: array
          items: { type: integer }
        available_delivery_types:
          type: array
          items: { type: integer }
        delivery_time_text: { type: string, nullable: true }
        delivery_price_text: { type: string, nullable: true }
    RestaurantAddress:
      type: object
      properties:
        id: { type: integer }
        title: { type: string, nullable: true }
        latitude: { type: string, nullable: true }
        longitude: { type: string, nullable: true }
    Category:
      type: object
      properties:
        id: { type: integer }
        external_id: { type: string }
        name: { type: string }
        slug: { type: string }
        sort_order: { type: integer }
    CatalogCategory:
      allOf:
        - $ref: '#/components/schemas/Category'
        - type: object
          properties:
            products:
              type: array
              items: { $ref: '#/components/schemas/Product' }
    Product:
      type: object
      properties:
        id: { type: integer }
        external_id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        price: { type: string, example: '100.00' }
        promotion_price: { type: string, nullable: true }
        currency: { type: string, example: UAH }
        image_url: { type: string, nullable: true }
        is_available: { type: boolean }
        sort_order: { type: integer }
    Fulfillment:
      type: object
      properties:
        type: { type: string, enum: [delivery, pickup], nullable: true }
        dots_delivery_type: { type: integer, nullable: true }
        delivery_price: { nullable: true }
        delivery_address: { nullable: true }
        restaurant_address_id: { type: integer, nullable: true }
        external_address_id: { type: string, nullable: true }
    DeliveryAddressInput:
      type: object
      required: [type, street, house]
      properties:
        type: { type: integer, example: 1 }
        street: { type: string, example: Main Street }
        house: { type: string, example: '10' }
        flat: { type: string, nullable: true }
        stage: { type: string, nullable: true }
        note: { type: string, nullable: true }
        title: { type: string, nullable: true }
    DeliveryValidationResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            session_id: { type: string }
            delivery_available: { type: boolean }
            reason: { type: string, nullable: true, example: outside_delivery_zone }
            delivery_price: { nullable: true }
            dots_delivery_type: { type: integer, nullable: true }
            fulfillment: { $ref: '#/components/schemas/Fulfillment' }
    CartEnvelope:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Cart' }
    Cart:
      type: object
      properties:
        id: { type: integer }
        status: { type: string, enum: [active, checked_out, expired, abandoned] }
        currency: { type: string }
        subtotal: { type: string, example: '100.00' }
        total: { type: string, example: '100.00' }
        expires_at: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
    CartItem:
      type: object
      properties:
        id: { type: integer }
        product_id: { type: integer }
        external_product_id: { type: string }
        name: { type: string }
        quantity: { type: integer }
        unit_price: { type: string }
        total: { type: string }
    OrderEnvelope:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Order' }
    Order:
      type: object
      properties:
        id: { type: integer }
        external_order_id: { type: string, nullable: true }
        status: { type: string, enum: [draft, creating, created, failed] }
        failure_message: { type: string, nullable: true }
        receiving_type: { type: string, enum: [delivery, pickup] }
        payment_type: { type: integer, example: 2 }
        fulfillment: { type: object }
        total: { type: string }
        currency: { type: string }
        payment: { $ref: '#/components/schemas/Payment' }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
    OrderItem:
      type: object
      properties:
        product_id: { type: integer, nullable: true }
        external_product_id: { type: string }
        name: { type: string }
        quantity: { type: integer }
        unit_price: { type: string }
        total: { type: string }
    Payment:
      type: object
      properties:
        status: { type: string, enum: [pending, ready] }
        checkout_url:
          type: string
          nullable: true
          example: https://checkout.example.test/pay/placeholder
        payment_received_at: { type: string, format: date-time, nullable: true }
        qr_ready: { type: boolean }
    PaymentStateEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            status: { type: string, enum: [pending, ready] }
            checkout_url:
              type: string
              nullable: true
              example: https://checkout.example.test/pay/placeholder
            payment_received_at: { type: string, format: date-time, nullable: true }
